<div class="login-container">
  <div class="login-card">

    <!-- Dynamic logo -->
    <div class="logo" *ngIf="logoUrl">
      <img [src]="logoUrl" [alt]="companyName" />
    </div>

    <h2>{{ companyName }}</h2>
    <p style="text-align:center; color:#666; margin-bottom:24px">Sign in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        <mat-icon matPrefix>person</mat-icon>
        <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
          Username is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-icon matPrefix>lock</mat-icon>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          At least 8 characters
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20" style="display:inline-block"></mat-spinner>
        <span *ngIf="!loading">Sign In</span>
      </button>

    </form>

    <p style="text-align:center; margin-top:16px">
      Don't have an account?
      <a routerLink="/auth/register" style="color: var(--primary-color)">Register</a>
    </p>
  </div>
</div>
