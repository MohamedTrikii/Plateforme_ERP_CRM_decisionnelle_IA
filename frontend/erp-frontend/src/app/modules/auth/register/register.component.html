<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" />
        <mat-error *ngIf="registerForm.get('fullName')?.hasError('required')">Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" />
        <mat-error *ngIf="registerForm.get('username')?.hasError('minlength')">Min 3 chars</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
        <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Invalid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Min 8 chars</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Company / Tenant ID</mat-label>
        <input matInput formControlName="tenantId" placeholder="e.g. acme-corp" />
        <mat-error *ngIf="registerForm.get('tenantId')?.hasError('required')">Required</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" class="submit-btn"
              [disabled]="registerForm.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20" style="display:inline-block"></mat-spinner>
        <span *ngIf="!loading">Create Account</span>
      </button>
    </form>

    <p style="text-align:center; margin-top:16px">
      Already have an account?
      <a routerLink="/auth/login" style="color: var(--primary-color)">Sign In</a>
    </p>
  </div>
</div>
