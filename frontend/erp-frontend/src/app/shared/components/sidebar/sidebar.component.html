<mat-nav-list class="sidebar-nav">

  <ng-container *ngFor="let item of navItems">
    <a
      *ngIf="isVisible(item)"
      mat-list-item
      [routerLink]="item.route"
      routerLinkActive="active-link"
      class="nav-item">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  </ng-container>

</mat-nav-list>
