version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass}
      POSTGRES_DB:       erp_auth            # default DB; init scripts create the rest
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: erp-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/erp_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass}
      JWT_SECRET:                 ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE:     docker
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Core Service ────────────────────────────────────────────────────────────
  core-service:
    build:
      context: ./backend/core-service
      dockerfile: Dockerfile
    container_name: erp-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/erp_core
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass}
      JWT_SECRET:                 ${JWT_SECRET}
      AI_SERVICE_URL:             http://ai-service:8000/api/v1/ai
      SPRING_PROFILES_ACTIVE:     docker
    ports:
      - "8082:8082"

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: erp-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - core-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CORE_SERVICE_URL: http://core-service:8082
      AI_SERVICE_URL:   http://ai-service:8000
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"

  # ── AI Service (Python FastAPI) ─────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: erp-ai
    restart: unless-stopped
    ports:
      - "8000:8000"

  # ── Angular Frontend (Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/erp-frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"

volumes:
  postgres_data:
