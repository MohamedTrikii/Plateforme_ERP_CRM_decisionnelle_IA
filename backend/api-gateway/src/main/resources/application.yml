server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Global CORS – applies to all routes
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:80"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # ── Auth Service ───────────────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # ── Core Service ───────────────────────────────────────────────
        - id: core-service-customers
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**

        - id: core-service-products
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**

        - id: core-service-orders
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/orders/**

        - id: core-service-stock
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/stock/**

        - id: core-service-config
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/config/**

        - id: core-service-dashboard
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/dashboard/**

        - id: core-service-audit
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/audit/**

        # ── AI Service ─────────────────────────────────────────────────
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=3

management:
  endpoints:
    web:
      exposure:
        include: health, gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
